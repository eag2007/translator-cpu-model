name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  golden-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить PyYAML
        run: python -m pip install PyYAML

      - name: Запустить golden-тесты
        run: python test/test_golden.py

  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить инструменты
        run: python -m pip install PyYAML types-PyYAML ruff mypy

      - name: Проверить форматирование
        run: python -m ruff format --check .

      - name: Проверить код Ruff
        run: python -m ruff check .

      - name: Проверить типы
        run: python -m mypy --ignore-missing-imports .